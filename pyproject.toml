[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-futures-research"
version = "0.1.0"
description = "Research-only Chinese futures backtesting tools"
requires-python = ">=3.10,<3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
